name: 构建各平台安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "只上传 artifacts，不发 Release"
        type: boolean
        default: false

# 构建产物不含作者私人名片：src/assets/wechat-card.png 不入库。
# 若希望 CI 产物也带名片，在仓库 Secrets 里配 WECHAT_CARD_B64（base64 后的 PNG），
# 下面的步骤会在构建前还原；不配置则自动使用占位图，构建照常成功。
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 还原私人名片（若配置了 Secret）
        shell: bash
        run: |
          if [ -n "${WECHAT_CARD_B64:-}" ]; then
            printf '%s' "$WECHAT_CARD_B64" | base64 -d > src/assets/wechat-card.png
            echo "已还原真名片"
          else
            echo "未配置 WECHAT_CARD_B64，使用占位图"
          fi
        env:
          WECHAT_CARD_B64: ${{ secrets.WECHAT_CARD_B64 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: 构建 NSIS 安装包
        run: npx tauri build --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 准备绿色版（免安装单文件）
        shell: bash
        run: |
          mkdir -p portable
          cp src-tauri/target/release/more.exe portable/More.exe
          ls -la portable
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            portable/More.exe

  macos-apple-silicon:
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 还原私人名片（若配置了 Secret）
        run: |
          if [ -n "${WECHAT_CARD_B64:-}" ]; then
            printf '%s' "$WECHAT_CARD_B64" | base64 -d > src/assets/wechat-card.png
          fi
        env:
          WECHAT_CARD_B64: ${{ secrets.WECHAT_CARD_B64 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: src-tauri/target/release/bundle/dmg/*.dmg

  macos-intel:
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # 交叉到 x86_64：同一台 arm runner 上产出 Intel 包，省掉一台慢的 Intel runner
      - run: npx tauri build --target x86_64-apple-darwin --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, windows, macos-apple-silicon, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: 归拢产物
        run: |
          mkdir -p out
          find dist-artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} out/ \;
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: out/*
          draft: ${{ github.event.inputs.draft == 'true' }}
          body: |
            自动构建产物。未做 Apple 签名与公证：macOS 首次打开若提示「已损坏」，
            执行 `xattr -cr /Applications/More.app`。Windows 为 NSIS 安装包。
            若安装包里没有作者微信名片，说明 CI 未配置 WECHAT_CARD_B64，属正常情况。
